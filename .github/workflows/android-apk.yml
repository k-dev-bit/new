
name: Build Nova AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nova-ai-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check project files
        run: |
          test -f settings.gradle.kts -o -f settings.gradle
          test -f build.gradle.kts -o -f build.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          echo "Android project files found"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          find "$APK_DIR" -maxdepth 1 -name '*.apk' -print
          test -n "$(find "$APK_DIR" -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
